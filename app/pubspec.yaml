name: clippo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Licenças das fontes (OFL), mostradas na tela de licenças do app.
  assets:
    - assets/fonts/Anton-OFL.txt
    - assets/fonts/Archivo-OFL.txt

  # Fontes do design (Google Fonts, licença OFL), embutidas para funcionar sem internet.
  # Nomes das famílias usados em lib/core/theme/clippo_tokens.dart.
  fonts:
    - family: Anton
      fonts:
        - asset: assets/fonts/Anton-Regular.ttf
          weight: 400
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
